name: lucent
description: "Lucent - a simple, offline budget tracker."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE.txt
    - assets/brand/logo-256.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
