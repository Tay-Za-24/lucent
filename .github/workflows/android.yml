name: Android build

# Builds the release APK on GitHub's computers. The private signing key is
# never uploaded here, so this APK is signed with a throwaway debug key; the
# published APK is re-signed with the real key on the maintainer's machine.
on:
  push:
    branches: [main, macos]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: Lucent-android-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
