name: macOS build

on:
  push:
    branches: [macos]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build macos --release

      - name: Zip Lucent.app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent Lucent.app "$GITHUB_WORKSPACE/Lucent-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Lucent-macos
          path: Lucent-macos.zip
          if-no-files-found: error
